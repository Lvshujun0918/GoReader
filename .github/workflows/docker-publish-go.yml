name: Publish Docker Image

# 每次提交到 master 构建并推送 Docker 镜像（仅 GHCR）：
#   - 版本标签 = 短 SHA（7 位，如 `abc1234`）——可追溯、无需手动打 tag
#   - `latest` = master 最新提交（滚动）
# Dockerfile 多阶段内部已包含前端构建，无需单独的 Release 二进制 job。
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 并发控制：同分支新提交自动取消旧 run（避免镜像堆积/排队）
concurrency:
  group: docker-publish-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 计算短 SHA（镜像版本标签）
        id: sha
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取元数据（tags/labels）
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          # 短 SHA 版本标签（每次提交唯一、可追溯）+ master 最新滚动标签
          tags: |
            type=raw,value=${{ steps.sha.outputs.short }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: 构建并推送镜像（amd64，gha 远程缓存——hosted runner 跨 run 复用）
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
