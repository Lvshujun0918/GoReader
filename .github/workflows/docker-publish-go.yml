name: Publish Go Release

on:
  push:
    tags:
      - 'v5.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: docker-publish-go
  cancel-in-progress: true

jobs:
  # ================= Linux 静态二进制 + GitHub Release =================
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 发版保护（仅 master 祖先）
        shell: bash
        run: |
          git fetch origin master --quiet || true
          if git merge-base --is-ancestor $GITHUB_SHA origin/master; then
            echo 'OK 允许发版'
          else
            echo "SHA $GITHUB_SHA 非 master 祖先——拒绝发版"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: 构建前端（npm ci 走 lockfile——比 npm install 快且可复现）
        working-directory: web-ui
        run: |
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go.sum

      - name: 构建 Go release（CGO_ENABLED=0 静态链接——纯 Go SQLite 驱动，无 C 依赖）
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
            -o dist/reader-dev-linux-x64 ./cmd/server

      - name: 校验静态链接
        run: file dist/reader-dev-linux-x64

      - name: 发布 GitHub Release（linux 静态二进制资产）
        uses: softprops/action-gh-release@v2
        with:
          files: dist/reader-dev-linux-x64
          generate_release_notes: true

  # ================= Windows exe（Go 原生交叉编译——无需额外工具链）================
  build-windows:
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: 交叉编译 Windows exe
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
            -o dist/reader-dev-windows-x64.exe ./cmd/server
      - name: 上传 exe 到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/reader-dev-windows-x64.exe

  # ================= Docker 多架构镜像 =================
  docker:
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU（多架构模拟）
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: 提取元数据（tags/labels）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/warpdotsys/reader
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha

      - name: 构建并推送多架构镜像（gha 远程缓存——hosted runner 跨 run 复用）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
