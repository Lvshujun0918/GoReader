name: Publish Rust Release

on:
  push:
    tags:
      - 'v5.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: docker-publish-rust
  cancel-in-progress: true

jobs:
  # ================= Linux musl 静态二进制 + GitHub Release =================
  build-release:
    runs-on: DE
    env:
      # sccache：Rust 编译缓存（DE 本地 sccache 服务 + GHA cache 远端持久化）
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 发版保护（v1.* 仅 master 祖先）
        shell: bash
        run: |
          git fetch origin master --quiet || true
          if git merge-base --is-ancestor $GITHUB_SHA origin/master; then
            echo 'OK 允许发版'
          else
            echo "SHA $GITHUB_SHA 非 master 祖先——拒绝发版"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存 npm（~/.npm + node_modules——lockfile 变化才失效）
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            web-ui/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('web-ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: 构建前端（npm ci 走 lockfile——比 npm install 快且可复现）
        working-directory: web-ui
        run: |
          npm ci
          npm run build

      - name: Setup Rust（复用 DE 常驻 rustup——避免 dtolnay 下载网络抖动；musl target 带重试）
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version
          for i in 1 2 3 4 5; do
            if rustup target add x86_64-unknown-linux-musl 2>/dev/null; then
              echo "musl target 就绪（第 $i 次尝试）"
              break
            fi
            echo "musl target 安装失败（第 $i 次）——5s 后重试"
            sleep 5
          done
          rustup target list --installed | grep musl

      - name: 安装 musl 链接器（musl-gcc——libsqlite3-sys/ring/zstd-sys 等 C 依赖）
        run: |
          if command -v musl-gcc >/dev/null 2>&1; then
            echo "musl-gcc 已安装——跳过 apt（DE 常驻）"
          elif command -v sudo >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          else
            apt-get update -qq && apt-get install -y -qq musl-tools
          fi

      - name: 缓存 cargo registry（DE 跨 run 复用依赖下载）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: 启动 sccache（Rust 编译缓存——DE 装 sccache 最优）
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0

      - name: 构建 Rust release（musl 静态链接——无 glibc 依赖，Debian 12/任何发行版可跑）
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: 打包 Linux 静态二进制
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/reader-dev dist/reader-dev-linux-x64-musl
          chmod +x dist/reader-dev-linux-x64-musl

      - name: 校验静态链接
        run: |
          if command -v file >/dev/null 2>&1; then
            file dist/reader-dev-linux-x64-musl
          else
            echo "file 命令不可用——跳过静态校验"
          fi

      - name: 发布 GitHub Release（linux musl 资产）
        uses: softprops/action-gh-release@v2
        with:
          files: dist/reader-dev-linux-x64-musl
          generate_release_notes: true

  # ================= Windows 签名 exe（GitHub hosted runner）=================
  build-windows-signed:
    runs-on: windows-latest
    needs: build-release
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 rust 工具链（~/.rustup——hosted runner 跨 run 复用）
        uses: actions/cache@v4
        with:
          path: ~/.rustup
          key: ${{ runner.os }}-rustup-stable
          restore-keys: |
            ${{ runner.os }}-rustup-

      - name: 缓存 cargo（registry + target）
        uses: Swatinem/rust-cache@v2

      - name: cargo build (release)
        run: cargo build --release

      - name: 代码签名（PFX 证书来自 secrets——绝不打印 secret 内容，日志只显示签名状态）
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          PFX_PWD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:PFX_B64) -or [string]::IsNullOrEmpty($env:PFX_PWD)) {
            Write-Error "WINDOWS_CODESIGN_PFX / WINDOWS_CODESIGN_PASSWORD 未配置——拒绝发布未签名 exe"
            exit 1
          }
          $bytes = [Convert]::FromBase64String($env:PFX_B64)
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          try {
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, $env:PFX_PWD)
            $exe = Join-Path (Get-Location) "target\release\reader-dev.exe"
            $sig = Set-AuthenticodeSignature -FilePath $exe -Certificate $cert
            Write-Host "签名状态: $($sig.Status)"
            if ($sig.Status -ne "Valid") { exit 1 }
            New-Item -ItemType Directory -Force dist | Out-Null
            Copy-Item $exe (Join-Path (Get-Location) "dist\reader-dev-windows-x64.exe")
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: 上传签名 exe 到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/reader-dev-windows-x64.exe

  # ================= Docker 多架构镜像 =================
  docker:
    runs-on: DE
    needs: build-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 登录 GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: 登录 Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
      - name: 构建并推送多架构镜像（buildx 本地磁盘缓存——DE 跨 run 复用；目录与 legacy 工作流隔离）
        run: |
          docker buildx create --use --name reader-builder || docker buildx use reader-builder
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --cache-from type=local,src=/tmp/buildx-cache-rust \
            --cache-to type=local,dest=/tmp/buildx-cache-rust,mode=max \
            -t ghcr.io/${{ github.repository }}:latest \
            -t ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/reader-dev:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/reader-dev:${{ github.ref_name }} \
            .
