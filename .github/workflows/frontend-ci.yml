name: Frontend CI

on:
  push:
    branches: [master]
    paths: ["web-ui/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    branches: [master]
    paths: ["web-ui/**", ".github/workflows/frontend-ci.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: npm ci
        run: npm ci

      - name: 前端构建（vue-tsc 类型检查 + vite）
        run: npm run build
