name: Rust CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 缓存
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt 检查
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-features

      - name: cargo build (release)
        run: cargo build --release

  build-windows-signed:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存
        uses: Swatinem/rust-cache@v2

      - name: cargo build (release)
        run: cargo build --release

      - name: 代码签名（自签证书来自 secrets）
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          PFX_PWD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:PFX_B64)
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, $env:PFX_PWD)
          $exe = Join-Path (Get-Location) "target\release\reader-dev.exe"
          $sig = Set-AuthenticodeSignature -FilePath $exe -Certificate $cert
          Write-Host "签名状态: $($sig.Status)"
          if ($sig.Status -ne "Valid") { exit 1 }
          Remove-Item $pfxPath

      - uses: actions/upload-artifact@v4
        with:
          name: reader-dev-windows-signed
          path: target/release/reader-dev.exe
