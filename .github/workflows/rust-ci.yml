name: Rust CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # 与发布流程一致：musl 目标常驻，防止 release 静态构建在 CI 之外才暴露问题
          targets: x86_64-unknown-linux-musl

      - name: 缓存
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt 检查
        run: cargo fmt --all -- --check

      - name: cargo clippy
        # 风格类 lint 放宽（doc 缩进/identical blocks/while let 等不影响正确性）——正确性 lint 保持严格
        run: cargo clippy --all-targets -- -A warnings -D clippy::correctness

      - name: cargo test
        run: cargo test --all-features

      - name: cargo build (release)
        run: cargo build --release

      - name: 安装 musl 链接器（musl-gcc——C 依赖编译）
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: cargo check (musl 静态目标)
        run: cargo check --target x86_64-unknown-linux-musl

  build-windows-signed:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 rust 工具链（~/.rustup——hosted runner 跨 run 复用）
        uses: actions/cache@v4
        with:
          path: ~/.rustup
          key: ${{ runner.os }}-rustup-stable
          restore-keys: |
            ${{ runner.os }}-rustup-

      - name: 缓存
        uses: Swatinem/rust-cache@v2

      - name: cargo build (release)
        run: cargo build --release

      - name: 校验产物（签名已移除——SmartScreen 提示属预期；构建/链接验证）
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) "target\release\reader-dev.exe"
          if (-not (Test-Path $exe)) { Write-Error "exe 未生成"; exit 1 }
          Write-Host "exe 大小: $((Get-Item $exe).Length) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: reader-dev-windows-signed
          path: target/release/reader-dev.exe
